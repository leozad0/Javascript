<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #calc{
            background-color: #13c2e0;
            color: white;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
        }

        input{
            margin: auto;
            margin-bottom: 20px;
            padding: 10px;
            width: 200px;
            border: none;
            border-radius: 5px;
        }

        button{
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #resultadoSoma, #resultadoSub, #resultadoMult, #resultadoDiv{
            margin-top: 10px;
            font-size: 1.2em;
        }

        #limpar{
            background-color: #e40f25;
            color: white;
            width: 100px;
            margin: auto;
        }
    </style>

</head>
<body>
    <div id="calc">
        <h1>Calculadora</h1>
        <input type="number" name="num1" id="num1" placeholder="Digite o primeiro número">
        <input type="number" name="num2" id="num2" placeholder="Digite o segundo número">
        <button onclick="somar()" type="button">Somar</button>
        <div id="resultadosoma"></div>

        <button onclick="subtrair()" type="button">Subtrair</button>
        <div id="resultadosubtracao"></div>

        <button onclick="mult()" type="button">Multiplicar</button>
        <div id="resultadomultiplicacao"></div>

        <button onclick="dividir()" type="button">Dividir</button>
        <div id="resultadodivisao"></div>

        <button onclick="limpar()" type="button" id="limpar">Limpar</button>
    </div>

    <script>
        var num1 = document.querySelector('#num1');
        var num2 = document.querySelector('#num2');
        var resultadoSoma = document.querySelector('#resultadosoma');
        var resultadoSub = document.querySelector('#resultadosubtracao');
        var resultadoMult = document.querySelector('#resultadomultiplicacao');
        var resultadoDiv = document.querySelector('#resultadodivisao');

            function somar(){
                var n1 = parseFloat(num1.value);
                var n2 = parseFloat(num2.value);
                var soma = n1 + n2;
                resultadoSoma.innerHTML = "<p>O resultado é: " + soma + "</p>";
            }

            function subtrair(){
                var n1 = parseFloat(num1.value);
                var n2 = parseFloat(num2.value);
                var subtracao = n1 - n2;
                resultadoSub.innerHTML = "<p>O resultado é: " + subtracao + "</p>";
            }

            function mult(){
                var n1 = parseFloat(num1.value);
                var n2 = parseFloat(num2.value);
                var multiplicacao = n1 * n2;
                resultadoMult.innerHTML = "<p>O resultado é: " + multiplicacao + "</p>";
            }

            function dividir(){
                var n1 = parseFloat(num1.value);
                var n2 = parseFloat(num2.value);
                var divisao = n1 / n2;
                resultadoDiv.innerHTML = "<p>O resultado é: " + divisao + "</p>";
            }

            function limpar(){
                num1.value = "";
                num2.value = "";
                resultadoSoma.innerHTML = "";
                resultadoSub.innerHTML = "";
                resultadoMult.innerHTML = "";
                resultadoDiv.innerHTML = "";
            }
    </script>
</body>
</html>
