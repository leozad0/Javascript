<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>

    <style>
        div#area {
            width: 400px;
            height: 200px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>

</head>
<body>

    <div id="area">
        <h1>DOM - Document Object Model</h1>
    </div>

    <script>
        addEventListener("click", clicar);
        addEventListener("mouseout", sair);

        function clicar(){
            var area = document.querySelector("#area");
            area.innerHTML = "<h1>Clicou!</h1>";
        }

        function sair(){
            var area = document.querySelector("#area");
            area.innerHTML = "<h1>DOM - Document Object Model</h1>";
        }
    </script>
</body>
</html>
